<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open art experiments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #1a1a1a;
      text-transform: lowercase;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      selection-background-color: #f0f0f0;
      padding: 2rem;
    }

    .container {
      text-align: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    nav a {
      color: #1a1a1a;
      text-decoration: none;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      position: relative;
      padding: 0.2rem 0.5rem;
      transition: color 0.25s ease, opacity 0.25s ease, letter-spacing 0.25s ease;
      opacity: 0.85;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 1px;
      background: #1a1a1a;
      transition: width 0.3s ease, left 0.3s ease;
    }

    nav a:hover {
      opacity: 1;
      letter-spacing: 0.14em;
    }

    nav a:hover::after {
      width: 100%;
      left: 0;
    }

    nav a:focus-visible {
      outline: 1px dotted #888888;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main class="container">
    <nav aria-label="experiments menu">
      <ul>
        <li>
          <a href="experiments/BOT.html">bots</a>
        </li>
      </ul>
    </nav>
  </main>
</body>

</html>
