<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bots</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #dce4ed;
      color: #17243a;
      font-family: Inter, system-ui, Arial, sans-serif
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      background: #ffffffdf;
      backdrop-filter: blur(16px);
      padding: 17px;
      border-radius: 18px;
      box-shadow: 0 10px 35px #24334b25;
      max-width: 310px
    }

    .hud h1 {
      font-size: 17px;
      margin: 0 0 5px
    }

    .hud p {
      font-size: 12px;
      line-height: 1.5;
      color: #637087;
      margin: 0 0 12px
    }

    .control {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
      font-size: 12px
    }

    .control label {
      width: 70px
    }

    .control input {
      flex: 1;
      min-width: 0;
      accent-color: #426dd9
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    button {
      background: #243858;
      color: white;
      border: 0;
      padding: 9px 11px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px
    }

    button.alt {
      background: #e8edf6;
      color: #243858
    }

    .bubble {
      position: fixed;
      z-index: 2;
      left: 50%;
      top: 22%;
      transform: translate(-50%, -100%);
      background: white;
      border: 2px solid #233b5c;
      border-radius: 20px;
      padding: 13px 18px;
      max-width: min(330px, 65vw);
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 24px #26354b2c;
      pointer-events: none
    }

    .hide {
      display: none;
    }

    .bubble:after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 47%;
      width: 19px;
      height: 19px;
      background: white;
      border-right: 2px solid #233b5c;
      border-bottom: 2px solid #233b5c;
      transform: rotate(45deg)
    }

    .tip {
      position: fixed;
      bottom: 15px;
      right: 18px;
      background: #ffffffd9;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 11px;
      color: #516078
    }

    @media(max-width:600px) {
      .hud {
        top: 10px;
        left: 10px;
        padding: 12px;
        max-width: 235px
      }

      .hud h1 {
        font-size: 14px
      }

      .bubble {
        font-size: 12px;
        top: 31%
      }

      .tip {
        bottom: 8px;
        right: 8px
      }
    }

    .sound-enable {
      position: fixed;
      bottom: 56px;
      right: 18px;
      z-index: 10;
      background: #243858;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font: 600 12px system-ui;
      box-shadow: 0 5px 20px #24334b55;
      cursor: pointer
    }
  </style>
</head>
